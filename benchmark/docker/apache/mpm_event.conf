# tuned up for benchmarking, same rationale as ReadMe.md's Benchmarks section
# and CLAUDE.md's Phase 15 log: the stock MaxRequestWorkers default (150) caps
# concurrency well below what a production-tuned deployment would run.
<IfModule mpm_event_module>
    StartServers            4
    MinSpareThreads         75
    MaxSpareThreads         250
    ThreadLimit             64
    ThreadsPerChild         64
    MaxRequestWorkers       800
    MaxConnectionsPerChild  0
</IfModule>
