# tuned up for benchmarking, same rationale as ../apache/mpm_event.conf and
# ReadMe.md's Benchmarks section -- the stock MaxRequestWorkers default caps
# concurrency well below what a production-tuned deployment would run.
# mpm_prefork (not mpm_event) because mod_php is not thread-safe and requires
# a non-threaded MPM -- this is the standard, real-world Apache+PHP setup,
# not a benchmark-only compromise.
<IfModule mpm_prefork_module>
    ServerLimit             800
    StartServers            20
    MinSpareServers         10
    MaxSpareServers         100
    MaxRequestWorkers       800
    MaxConnectionsPerChild  0
</IfModule>
