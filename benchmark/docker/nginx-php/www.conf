; php-fpm pool config for the scenario-3 benchmark -- tuned the same way
; apache/mpm_event.conf tunes Apache's stock worker limits up: the package
; default (a handful of children) caps concurrency well below what a
; production-tuned deployment would run, same rationale as ReadMe.md's
; Benchmarks section.
[www]
user = nobody
group = nobody
listen = 127.0.0.1:9000

pm = static
pm.max_children = 200
